<!-- 登录页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - CampusMall</title>
    <style>
        .demo-account { margin: 12px 0; color: #475569; text-align: center; }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { margin: 0; background: #f0f2f5; }
        .login-layout {
            display: flex;
            min-height: 100vh;
        }
        /* 左侧品牌区 */
        .login-brand {
            flex: 1;
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .login-brand::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            top: -80px;
            left: -80px;
        }
        .login-brand::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            bottom: -60px;
            right: -40px;
        }
        .brand-icon {
            font-size: 64px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }
        .brand-desc {
            font-size: 16px;
            opacity: 0.85;
            text-align: center;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }
        .brand-features {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }
        .brand-feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            opacity: 0.9;
        }
        .brand-feature-icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        /* 右侧登录区 */
        .login-form-side {
            width: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #fff;
        }
        .login-form-box {
            width: 100%;
            max-width: 360px;
        }
        .login-form-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .login-form-subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 32px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.12);
        }
        .login-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .login-btn:hover { background: var(--primary-hover); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-light);
        }
        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover { text-decoration: underline; }
        @media (max-width: 768px) {
            .login-brand { display: none; }
            .login-form-side { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="login-layout">
        <!-- 左侧品牌 -->
        <div class="login-brand">
            <div class="brand-icon">🛒</div>
            <div class="brand-title">CampusMall</div>
            <div class="brand-desc">校园购物商城<br>便捷 · 安全 · 高效</div>
            <div class="brand-features">
                <div class="brand-feature">
                    <div class="brand-feature-icon">📱</div>
                    <span>海量校园好物，一键下单</span>
                </div>
                <div class="brand-feature">
                    <div class="brand-feature-icon">🚚</div>
                    <span>校内快速配送，当日达</span>
                </div>
                <div class="brand-feature">
                    <div class="brand-feature-icon">🔒</div>
                    <span>安全支付，放心购物</span>
                </div>
            </div>
        </div>

        <!-- 右侧表单 -->
        <div class="login-form-side">
            <div class="login-form-box">
                <div class="login-form-title">欢迎回来</div>
                <div class="login-form-subtitle">请登录你的账号</div>

                <div class="demo-account">Demo account: demo / CampusMall2026!</div>
                <form id="loginForm" onsubmit="return handleLogin(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">登 录</button>
                </form>

                <div class="login-link">
                    Public registration is disabled in the demo.
                </div>
            </div>
        </div>
    </div>

<script src="js/api.js"></script>
<script>
    // 如果已登录，跳转
    if (Token.get()) {
        location.href = 'index.html';
    }

    async function handleLogin(e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            Toast.warning('请填写用户名和密码');
            return false;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            const result = await API.post('/user/login', { username, password });

            if (result.token) {
                Token.set(result.token);
            }
            if (result.user) {
                UserInfo.set(result.user);
            }

            Toast.success('登录成功');

            setTimeout(() => {
                location.href = 'index.html';
            }, 500);
        } catch (e) {
            Toast.error(e.message || '登录失败');
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }

        return false;
    }
</script>

</body>
</html>

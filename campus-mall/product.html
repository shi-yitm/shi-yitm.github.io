<!-- 商品详情页面 - qiaoshuai -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - CampusMall</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .product-detail {
            display: flex;
            gap: 40px;
            padding: 24px 0;
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        .product-gallery {
            width: 400px;
            flex-shrink: 0;
        }
        .product-main-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: var(--radius);
            background: #f9f9f9;
        }
        .product-thumbs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            overflow-x: auto;
        }
        .product-thumbs img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: var(--radius);
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
        }
        .product-thumbs img.active, .product-thumbs img:hover {
            border-color: var(--primary);
        }
        .product-info {
            flex: 1;
            padding-right: 24px;
        }
        .product-title {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .product-subtitle {
            color: var(--text-light);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .product-price-box {
            background: #fff7e6;
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }
        .product-price-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .product-price-current {
            font-size: 28px;
            font-weight: 700;
            color: var(--danger);
        }
        .product-price-current small {
            font-size: 16px;
        }
        .product-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-light);
        }
        .sku-section {
            margin-bottom: 20px;
        }
        .sku-section label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }
        .sku-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sku-option {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .sku-option:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .sku-option.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #e6f7ff;
        }
        .sku-option.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .quantity-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .quantity-section label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .quantity-control button {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg);
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .quantity-control button:hover:not(:disabled) {
            background: var(--border);
        }
        .quantity-control input {
            width: 60px;
            height: 36px;
            text-align: center;
            border: none;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            font-size: 14px;
            outline: none;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
        }
        .stock-info {
            font-size: 13px;
            color: var(--text-light);
        }
        .product-desc-section {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 24px;
        }
        .product-desc-section h3 {
            font-size: 16px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .product-desc-content {
            line-height: 1.8;
            color: var(--text-secondary);
        }
        .product-desc-content img {
            max-width: 100%;
            border-radius: var(--radius);
        }
        @media (max-width: 768px) {
            .product-detail {
                flex-direction: column;
                gap: 20px;
            }
            .product-gallery {
                width: 100%;
            }
            .product-info {
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>

<header id="navbar"></header>
<div id="categoryNav" class="category-nav"></div>

<div class="container" id="mainContent">
    <div class="loading">加载中</div>
</div>

<!-- 收藏弹窗 -->
<div class="modal-overlay" id="favoriteModal">
    <div class="modal">
        <div class="modal-header">
            <h3>提示</h3>
            <button class="modal-close" onclick="closeModal('favoriteModal')">✕</button>
        </div>
        <div class="modal-body" id="favoriteModalBody">确定收藏该商品？</div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('favoriteModal')">取消</button>
            <button class="btn btn-primary" onclick="confirmFavorite()">确定</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/product-images.js"></script>
<script src="js/app.js"></script>
<script>
    let product = null;
    let skuList = [];
    let selectedSku = null;
    let currentQty = 1;
    let isFavorited = false;
    let currentImageIndex = 0;

    const productId = Utils.getParam('id');

    /**
     * 加载商品详情
     */
    async function loadProduct() {
        if (!productId) {
            document.getElementById('mainContent').innerHTML = '<div class="empty-state"><div class="icon">❓</div><p>商品不存在</p></div>';
            return;
        }

        try {
            const result = await API.get(`/product/${productId}`);
            product = result.product || result;
            skuList = result.skuList || result.skuList || [];

            renderProduct();
            checkFavorite();
        } catch (e) {
            document.getElementById('mainContent').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
        }
    }

    /**
     * 渲染商品详情
     */
    function renderProduct() {
        const images = parseImages(product.images);
        if (product.main_image && !images.includes(product.main_image)) {
            images.unshift(product.main_image);
        }

        const displayImages = [];
        const mainImg = getProductImageUrl(product.title);
        displayImages.push(mainImg);

        // 解析规格属性
        const specGroups = parseSpecGroups(skuList);

        let html = `
            <div class="breadcrumb">
                <a href="index.html">首页</a>
                <span>›</span>
                <span>${product.title}</span>
            </div>

            <div class="product-detail">
                <div class="product-gallery">
                    <img class="product-main-img" id="mainImg"
                         src="${mainImg}"
                         alt="${product.title}">
                    ${displayImages.length > 1 ? `
                        <div class="product-thumbs" id="thumbs">
                            ${displayImages.map((img, i) => `
                                <img src="${img}" class="${i === 0 ? 'active' : ''}"
                                     onclick="switchImage(${i}, '${img}')" alt="图片${i+1}">
                            `).join('')}
                        </div>
                    ` : ''}
                </div>

                <div class="product-info">
                    <div class="product-title">${product.title}</div>
                    <div class="product-subtitle">${product.subtitle || ''}</div>

                    <div class="product-price-box">
                        <div class="product-price-label">价格</div>
                        <div class="product-price-current" id="priceDisplay">
                            <small>¥</small>${skuList.length > 0 ? Number(skuList[0].price).toFixed(2) : '0.00'}
                        </div>
                    </div>

                    <div class="product-meta">
                        <span>品牌: ${product.brand || '未知'}</span>
                        <span id="salesInfo">销量: ${product.sales || 0}</span>
                    </div>

                    ${specGroups.length > 0 ? `
                        <div class="sku-section">
                            <label>规格选择</label>
                            <div class="sku-options" id="skuOptions">
                                ${renderSkuOptions(specGroups)}
                            </div>
                        </div>
                    ` : ''}

                    <div class="quantity-section">
                        <label>数量</label>
                        <div class="quantity-control">
                            <button onclick="changeQty(-1)" ${currentQty <= 1 ? 'disabled' : ''}>−</button>
                            <input type="number" id="qtyInput" value="${currentQty}" min="1" onchange="setQty(this.value)">
                            <button onclick="changeQty(1)">+</button>
                        </div>
                        <span class="stock-info" id="stockInfo">库存: ${skuList.length > 0 ? skuList[0].stock : 0}</span>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-outline" onclick="toggleFavorite()" id="favBtn">♡ 收藏</button>
                        <button class="btn btn-primary btn-lg" onclick="addToCart()">🛒 加入购物车</button>
                    </div>
                </div>
            </div>

            <div class="product-desc-section">
                <h3>商品详情</h3>
                <div class="product-desc-content">${product.description || '<p>暂无详情</p>'}</div>
            </div>
        `;

        document.getElementById('mainContent').innerHTML = html;
        renderCategoryNav(product.category_id);

        // 选中第一个 SKU
        if (skuList.length > 0) {
            selectSku(skuList[0]);
        }
    }

    /**
     * 解析图片 JSON
     */
    function parseImages(imagesStr) {
        if (!imagesStr) return [];
        try {
            const parsed = JSON.parse(imagesStr);
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return imagesStr ? [imagesStr] : [];
        }
    }

    /**
     * 解析规格分组
     */
    function parseSpecGroups(skus) {
        const groups = {};
        skus.forEach(sku => {
            if (!sku.spec_json) return;
            try {
                const spec = JSON.parse(sku.spec_json);
                Object.entries(spec).forEach(([key, value]) => {
                    if (!groups[key]) groups[key] = new Set();
                    groups[key].add(value);
                });
            } catch {}
        });

        return Object.entries(groups).map(([name, values]) => ({
            name,
            values: Array.from(values),
        }));
    }

    /**
     * 渲染规格选项
     */
    function renderSkuOptions(specGroups) {
        return specGroups.map(group => `
            <div class="sku-group" style="margin-bottom: 12px;">
                <div style="font-size: 13px; color: var(--text-light); margin-bottom: 6px;">${group.name}</div>
                <div class="sku-options">
                    ${group.values.map(val => `
                        <div class="sku-option" onclick="onSpecClick('${group.name}', '${val}')"
                             data-group="${group.name}" data-value="${val}">${val}</div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    // 已选规格
    let selectedSpecs = {};

    /**
     * 点击规格
     */
    function onSpecClick(group, value) {
        selectedSpecs[group] = value;

        // 更新 UI
        document.querySelectorAll(`.sku-option[data-group="${group}"]`).forEach(el => {
            el.classList.toggle('active', el.dataset.value === value);
        });

        // 匹配 SKU
        const matched = skuList.find(sku => {
            if (!sku.spec_json) return false;
            const spec = JSON.parse(sku.spec_json);
            return Object.entries(selectedSpecs).every(([k, v]) => spec[k] === v);
        });

        if (matched) {
            selectSku(matched);
        }
    }

    /**
     * 选中 SKU
     */
    function selectSku(sku) {
        selectedSku = sku;
        document.getElementById('priceDisplay').innerHTML = `<small>¥</small>${Number(sku.price).toFixed(2)}`;
        document.getElementById('stockInfo').textContent = `库存: ${sku.stock}`;
        // 只有sku_image是有效URL时才替换图片，否则保持当前商品图
        if (sku.sku_image && (sku.sku_image.startsWith('http') || sku.sku_image.startsWith('/') || sku.sku_image.startsWith('data:'))) {
            document.getElementById('mainImg').src = sku.sku_image;
        }
        currentQty = 1;
        document.getElementById('qtyInput').value = 1;
    }

    /**
     * 切换图片
     */
    function switchImage(index, src) {
        currentImageIndex = index;
        document.getElementById('mainImg').src = src;
        document.querySelectorAll('.product-thumbs img').forEach((img, i) => {
            img.classList.toggle('active', i === index);
        });
    }

    /**
     * 修改数量
     */
    function changeQty(delta) {
        const maxStock = selectedSku ? selectedSku.stock : 99;
        currentQty = Math.max(1, Math.min(maxStock, currentQty + delta));
        document.getElementById('qtyInput').value = currentQty;
    }

    function setQty(val) {
        const maxStock = selectedSku ? selectedSku.stock : 99;
        currentQty = Math.max(1, Math.min(maxStock, parseInt(val) || 1));
        document.getElementById('qtyInput').value = currentQty;
    }

    /**
     * 加入购物车
     */
    async function addToCart() {
        if (!requireLogin()) return;

        if (!selectedSku) {
            Toast.warning('请选择商品规格');
            return;
        }

        try {
            await API.post('/cart/add', {
                sku_id: selectedSku.sku_id,
                quantity: currentQty,
            });
            Toast.success('已加入购物车');
            updateCartBadge();
        } catch (e) {
            Toast.error(e.message || '加入购物车失败');
        }
    }

    /**
     * 收藏
     */
    async function checkFavorite() {
        if (!isLoggedIn()) return;
        try {
            const list = await API.get('/favorite/list');
            isFavorited = (list || []).some(f => f.product_id == productId);
            updateFavBtn();
        } catch {}
    }

    function toggleFavorite() {
        if (!requireLogin()) return;
        document.getElementById('favoriteModalBody').textContent = isFavorited ? '确定取消收藏？' : '确定收藏该商品？';
        document.getElementById('favoriteModal').classList.add('show');
    }

    async function confirmFavorite() {
        closeModal('favoriteModal');
        try {
            if (isFavorited) {
                await API.delete(`/favorite/${productId}`);
                isFavorited = false;
                Toast.success('已取消收藏');
            } else {
                await API.post('/favorite/add', { product_id: parseInt(productId) });
                isFavorited = true;
                Toast.success('已收藏');
            }
            updateFavBtn();
        } catch (e) {
            Toast.error(e.message || '操作失败');
        }
    }

    function updateFavBtn() {
        const btn = document.getElementById('favBtn');
        if (btn) {
            btn.innerHTML = isFavorited ? '❤ 已收藏' : '♡ 收藏';
            btn.className = isFavorited ? 'btn btn-danger btn-sm' : 'btn btn-outline';
        }
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }

    // 加载
    document.addEventListener('DOMContentLoaded', loadProduct);
</script>

</body>
</html>

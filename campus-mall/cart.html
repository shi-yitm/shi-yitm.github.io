<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - CampusMall</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-page {
            padding: 20px 0;
        }
        .cart-header {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            background: var(--bg-white);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            box-shadow: var(--shadow);
            font-size: 14px;
            color: var(--text-light);
        }
        .cart-header .col-check { width: 50px; text-align: center; }
        .cart-header .col-product { flex: 1; }
        .cart-header .col-price { width: 120px; text-align: center; }
        .cart-header .col-qty { width: 140px; text-align: center; }
        .cart-header .col-subtotal { width: 120px; text-align: center; }
        .cart-header .col-action { width: 80px; text-align: center; }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-white);
            border-top: 1px solid var(--border-light);
            transition: background 0.2s;
        }
        .cart-item:hover {
            background: #fafafa;
        }
        .cart-item .col-check { width: 50px; text-align: center; flex-shrink: 0; }
        .cart-item .col-product {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .cart-item .col-product img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius);
            flex-shrink: 0;
        }
        .cart-item .col-product .info {
            min-width: 0;
        }
        .cart-item .col-product .title {
            font-size: 14px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .cart-item .col-product .spec {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .cart-item .col-price { width: 120px; text-align: center; color: var(--danger); font-weight: 600; flex-shrink: 0; }
        .cart-item .col-qty { width: 140px; text-align: center; flex-shrink: 0; }
        .cart-item .col-subtotal { width: 120px; text-align: center; color: var(--danger); font-weight: 600; flex-shrink: 0; }
        .cart-item .col-action { width: 80px; text-align: center; flex-shrink: 0; }

        .cart-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-white);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            box-shadow: var(--shadow);
            position: sticky;
            bottom: 0;
        }
        .cart-footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .cart-footer-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .cart-total {
            font-size: 14px;
        }
        .cart-total .amount {
            color: var(--danger);
            font-size: 22px;
            font-weight: 700;
        }

        .qty-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .qty-control button {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--bg);
            cursor: pointer;
            font-size: 14px;
        }
        .qty-control button:hover:not(:disabled) { background: var(--border); }
        .qty-control input {
            width: 40px;
            height: 28px;
            text-align: center;
            border: none;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            font-size: 13px;
            outline: none;
        }

        .delete-link {
            color: var(--text-light);
            cursor: pointer;
            font-size: 13px;
        }
        .delete-link:hover { color: var(--danger); }

        @media (max-width: 768px) {
            .cart-header { display: none; }
            .cart-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .cart-item .col-check { width: 30px; }
            .cart-item .col-product { flex-basis: calc(100% - 40px); }
            .cart-item .col-price,
            .cart-item .col-qty,
            .cart-item .col-subtotal,
            .cart-item .col-action {
                width: auto;
                flex-basis: calc(33% - 10px);
            }
            .cart-footer { flex-wrap: wrap; gap: 12px; }
        }
    </style>
</head>
<body>

<header id="navbar"></header>

<div class="container cart-page">
    <div class="page-header">
        <div class="page-title">🛒 我的购物车</div>
    </div>

    <div id="cartContent">
        <div class="loading">加载中</div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/product-images.js"></script>
<script src="js/app.js"></script>
<script>
    if (!requireLogin()) { /* redirect */ }

    let cartList = [];

    async function loadCart() {
        try {
            cartList = await API.get('/cart/list');
            if (!Array.isArray(cartList)) cartList = [];
            renderCart();
        } catch (e) {
            document.getElementById('cartContent').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
        }
    }

    function renderCart() {
        if (cartList.length === 0) {
            document.getElementById('cartContent').innerHTML = `
                <div class="card">
                    <div class="empty-state">
                        <div class="icon">🛒</div>
                        <p>购物车是空的</p>
                        <a href="index.html" class="btn btn-primary mt-16">去逛逛</a>
                    </div>
                </div>
            `;
            return;
        }

        const allChecked = cartList.every(item => item.checked);
        const checkedItems = cartList.filter(item => item.checked);
        const totalCount = checkedItems.reduce((s, i) => s + i.quantity, 0);
        const totalAmount = checkedItems.reduce((s, i) => s + Number(i.sku?.price || 0) * i.quantity, 0);

        let html = `
            <div class="cart-header">
                <div class="col-check"><input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleAll(this.checked)"></div>
                <div class="col-product">商品信息</div>
                <div class="col-price">单价</div>
                <div class="col-qty">数量</div>
                <div class="col-subtotal">小计</div>
                <div class="col-action">操作</div>
            </div>
        `;

        cartList.forEach(item => {
            const sku = item.sku || {};
            const product = item.product || {};
            const spec = sku.spec_json ? (() => {
                try { return Object.values(JSON.parse(sku.spec_json)).join(' / '); } catch { return ''; }
            })() : '';
            const subtotal = Number(sku.price || 0) * item.quantity;

            html += `
                <div class="cart-item" id="cartItem_${item.cart_id}">
                    <div class="col-check">
                        <input type="checkbox" ${item.checked ? 'checked' : ''}
                               onchange="toggleItem(${item.cart_id}, this.checked)">
                    </div>
                    <div class="col-product">
                        <a href="product.html?id=${product.product_id || ''}">
                            <img src="${getProductImageUrl(product.title, sku.sku_image || product.main_image)}"
                                 alt="${product.title || ''}">>
                        </a>
                        <div class="info">
                            <div class="title"><a href="product.html?id=${product.product_id || ''}">${product.title || '商品'}</a></div>
                            ${spec ? `<div class="spec">${spec}</div>` : ''}
                        </div>
                    </div>
                    <div class="col-price">${Utils.formatPrice(sku.price || 0)}</div>
                    <div class="col-qty">
                        <div class="qty-control">
                            <button onclick="updateQty(${item.cart_id}, ${item.quantity - 1})" ${item.quantity <= 1 ? 'disabled' : ''}>−</button>
                            <input type="number" value="${item.quantity}" min="1" onchange="updateQty(${item.cart_id}, parseInt(this.value))">
                            <button onclick="updateQty(${item.cart_id}, ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <div class="col-subtotal">${Utils.formatPrice(subtotal)}</div>
                    <div class="col-action">
                        <span class="delete-link" onclick="removeItem(${item.cart_id})">删除</span>
                    </div>
                </div>
            `;
        });

        html += `
            <div class="cart-footer">
                <div class="cart-footer-left">
                    <input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleAll(this.checked)">
                    <span>全选</span>
                    <span class="delete-link" onclick="removeChecked()">删除选中</span>
                </div>
                <div class="cart-footer-right">
                    <div class="cart-total">
                        已选 <strong>${totalCount}</strong> 件，合计:
                        <span class="amount">${Utils.formatPrice(totalAmount)}</span>
                    </div>
                    <button class="btn btn-primary btn-lg" onclick="goCheckout()" ${checkedItems.length === 0 ? 'disabled' : ''}>去结算</button>
                </div>
            </div>
        `;

        document.getElementById('cartContent').innerHTML = html;
        updateCartBadge();
    }

    async function toggleAll(checked) {
        try {
            await Promise.all(cartList.map(item =>
                API.put('/cart/update', { cart_id: item.cart_id, checked: checked ? 1 : 0 })
            ));
            cartList.forEach(item => item.checked = checked ? 1 : 0);
            renderCart();
        } catch (e) {
            Toast.error('操作失败');
        }
    }

    async function toggleItem(cartId, checked) {
        try {
            await API.put('/cart/update', { cart_id: cartId, checked: checked ? 1 : 0 });
            const item = cartList.find(i => i.cart_id === cartId);
            if (item) item.checked = checked ? 1 : 0;
            renderCart();
        } catch (e) {
            Toast.error('操作失败');
        }
    }

    async function updateQty(cartId, qty) {
        if (qty < 1) return;
        try {
            await API.put('/cart/update', { cart_id: cartId, quantity: qty });
            const item = cartList.find(i => i.cart_id === cartId);
            if (item) item.quantity = qty;
            renderCart();
        } catch (e) {
            Toast.error(e.message || '更新失败');
        }
    }

    async function removeItem(cartId) {
        if (!confirm('确定删除？')) return;
        try {
            await API.delete(`/cart/${cartId}`);
            cartList = cartList.filter(i => i.cart_id !== cartId);
            renderCart();
            Toast.success('已删除');
        } catch (e) {
            Toast.error('删除失败');
        }
    }

    async function removeChecked() {
        const checked = cartList.filter(i => i.checked);
        if (checked.length === 0) {
            Toast.warning('请先选择商品');
            return;
        }
        if (!confirm(`确定删除选中的 ${checked.length} 件商品？`)) return;

        try {
            await Promise.all(checked.map(i => API.delete(`/cart/${i.cart_id}`)));
            cartList = cartList.filter(i => !i.checked);
            renderCart();
            Toast.success('已删除');
        } catch (e) {
            Toast.error('删除失败');
        }
    }

    function goCheckout() {
        const checked = cartList.filter(i => i.checked);
        if (checked.length === 0) {
            Toast.warning('请先选择商品');
            return;
        }
        location.href = 'checkout.html';
    }

    document.addEventListener('DOMContentLoaded', loadCart);
</script>

</body>
</html>

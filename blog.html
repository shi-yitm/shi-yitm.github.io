<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 · 十一</title>
    <link rel="stylesheet" href="style.css">
    <style>
    body {
      background: url('images/bg-waves.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .navbar {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .navbar .logo {
      -webkit-text-fill-color: white;
      background: none;
    }
    .nav-links a {
      color: rgba(255,255,255,0.8) !important;
    }
    .nav-links a.active,
    .nav-links a:hover {
      color: white !important;
    }
    .nav-links a::after {
      background: white;
    }
    .hero {
      background: rgba(0,0,0,0.35);
    }
    .hero h1, .hero .highlight, .hero-subtitle, .hero-desc {
      color: white;
      -webkit-text-fill-color: white;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    .hero .highlight {
      background: none;
      -webkit-text-fill-color: #fbbf24;
    }
    .section {
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      margin: 0 24px;
      padding: 48px;
    }
    .section-title {
      color: white;
    }
    .section-title::after {
      background: #fbbf24;
    }
    .page-desc {
      color: rgba(255,255,255,0.7);
    }
    .post-card {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .post-card:hover {
      background: rgba(0,0,0,0.6);
      border-color: rgba(255,255,255,0.2);
    }
    .post-title a, .post-title {
      color: white !important;
    }
    .post-excerpt {
      color: rgba(255,255,255,0.75);
    }
    .post-date {
      color: rgba(255,255,255,0.6);
    }
    .post-readmore {
      color: #60a5fa !important;
    }
    .article-title {
      color: white;
    }
    .article-meta {
      color: rgba(255,255,255,0.7);
    }
    .article-content {
      color: rgba(255,255,255,0.9);
    }
    .article-content h2, .article-content h3 {
      color: white;
    }
    .article-content blockquote {
      background: rgba(255,255,255,0.1);
      border-left-color: #fbbf24;
      color: rgba(255,255,255,0.8);
    }
    .article-content code {
      background: rgba(255,255,255,0.15);
      color: #fbbf24;
    }
    .article-content pre {
      background: rgba(0,0,0,0.5);
    }
    .article-content th {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .article-content td {
      color: rgba(255,255,255,0.85);
    }
    .article-content tr:nth-child(even) td {
      background: rgba(255,255,255,0.05);
    }
    .article-footer {
      border-top-color: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
    }
    .back-link {
      color: #60a5fa !important;
    }
    .footer {
      background: rgba(0,0,0,0.5);
      border-top: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
    }
    .tag-dev {
      background: rgba(37,99,235,0.3);
      color: #93c5fd;
    }
    .tag-life {
      background: rgba(245,158,11,0.3);
      color: #fcd34d;
    }</style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="logo">十一</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="blog.html" class="active">博客</a></li>
                <li><a href="about.html">关于</a></li>
            </ul>
            <button class="menu-toggle" aria-label="菜单">☰</button>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <div class="page-header">
                <h1 class="section-title">全部文章</h1>
                <p class="page-desc">共 3 篇文章</p>
            </div>
            <div class="post-list">
                <article class="post-card">
                    <div class="post-tag tag-dev">技术</div>
                    <h3 class="post-title"><a href="article-4.html" style="color:inherit">我的第一个个人网站</a></h3>
                    <p class="post-excerpt">从零开始搭建个人博客的心路历程，记录下每一步的收获与踩坑。</p>
                    <div class="post-meta">
                        <span class="post-date">2026-06-04</span>
                        <a href="article-4.html" class="post-readmore">阅读全文 →</a>
                    </div>
                </article>
                <article class="post-card">
                    <div class="post-tag tag-life">生活</div>
                    <h3 class="post-title"><a href="article-5.html" style="color:inherit">开始写博客的理由</a></h3>
                    <p class="post-excerpt">为什么决定开始写博客，以及我希望通过写作收获什么。</p>
                    <div class="post-meta">
                        <span class="post-date">2026-06-04</span>
                        <a href="article-5.html" class="post-readmore">阅读全文 →</a>
                    </div>
                </article>
                <article class="post-card">
                    <div class="post-tag tag-dev">技术</div>
                    <h3 class="post-title"><a href="article-6.html" style="color:inherit">GitHub Pages 搭建指南</a></h3>
                    <p class="post-excerpt">最简单的免费建站方式，几分钟让你的网站在互联网上可见。</p>
                    <div class="post-meta">
                        <span class="post-date">2026-06-04</span>
                        <a href="article-6.html" class="post-readmore">阅读全文 →</a>
                    </div>
                </article>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>© 2026 十一 · 用 ❤️ 和代码构建</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
